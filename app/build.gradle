plugins {
    id "com.android.application"
}

android {
    namespace "io.github.fabiantorrestech.touchwallpaper"
    compileSdk 36

    defaultConfig {
        applicationId "io.github.fabiantorrestech.touchwallpaper"
        minSdk 30
        // Stays at 30: this app targets one Android 11 device and writes the ROM's wallpaper file (ADR 4).
        targetSdk 30
        // Commit count: grows with every commit, so an update never looks like a downgrade (ADR 3 in android-apps).
        versionCode providers.exec { commandLine "git", "rev-list", "--count", "HEAD" }
            .standardOutput.asText.get().trim().toInteger()
        versionName "1.0"
    }

    buildTypes {
        debug {
            // A separate app next to the released one (ADR 7 in android-apps).
            applicationIdSuffix ".debug"
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt")
            // Sideloaded only: the shared debug key (DEBUG_SHARED in android-apps) keeps updates
            // installing over the debug builds already on the device.
            signingConfig signingConfigs.debug
        }
    }

    lint {
        // A Google Play rule. This app is sideloaded and its target stays at 30 (ADR 4).
        disable "ExpiredTargetSdkVersion"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "com.google.android.material:material:1.12.0"
}
